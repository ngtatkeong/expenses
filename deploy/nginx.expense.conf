# Nginx reverse proxy for the Expense Management System on the Hostinger VPS.
# Copy to /etc/nginx/sites-available/expense, then:
#   sudo ln -s /etc/nginx/sites-available/expense /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name exp.kaoinai.com;

    # Receipt uploads can be sizeable (up to 15MB per file, enforced by multer too)
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/health {
        proxy_pass http://127.0.0.1:4200;
        access_log off;
    }
}

# After running certbot (see deploy/DEPLOY.md), it will add a second server
# block here for port 443 and rewrite this block to redirect HTTP -> HTTPS.
# Do not hand-edit that part — let certbot manage it.
